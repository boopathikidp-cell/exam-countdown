<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>தேர்வு கவுண்ட்டவுன் - மாடர்ன்</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        h1 {
            color: #4a5568;
            font-size: 1.6rem;
            margin-top: 0;
        }
        #countdown {
            font-size: 2.3rem;
            font-weight: 800;
            color: #2d3748;
            background: #edf2f7;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            border: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>அக்டோபர் 27 தேர்விற்கு இன்னும்...</h1>
    <div id="countdown">கணக்கிடப்படுகிறது...</div>
</div>

<script>
    const examDate = new Date("October 27, 2026 09:00:00").getTime();
    const timer = setInterval(function() {
        const now = new Date().getTime();
        const difference = examDate - now;
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerHTML = 
            days + " நாட்கள் " + hours + " ம : " + 
            minutes + " நி : " + seconds + " நொ";

        if (difference < 0) {
            clearInterval(timer);
            document.getElementById("countdown").innerHTML = "தேர்வு நாள் வந்துவிட்டது! ஆல் தி பெஸ்ட்!";
        }
    }, 1000);
</script>
</body>
</html>
